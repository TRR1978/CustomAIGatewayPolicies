# Template: Install dependencies with Pipenv
parameters:
  pythonVersion: '3.11'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: ${{ parameters.pythonVersion }}
      addToPath: true

  - script: |
      python -m pip install --upgrade pip
      pip install pipenv
      pipenv install --dev
    displayName: 'Install dependencies with Pipenv'

