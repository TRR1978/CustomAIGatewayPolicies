# Template: Build wheel package
steps:
  - bash: |
        echo "##vso[task.setvariable variable=BUILDID]$(Build.BuildId)"
        echo "##vso[task.setvariable variable=BUILDNUMBER]$(Build.BuildNumber)"
    displayName: create VERSION metadata

  - script: |
      pipenv run python setup.py bdist_wheel
    displayName: 'Build wheel package'

  - task: CopyFiles@2
    displayName: 'Copy Python'
    inputs:
      Contents: |
        **/*.whl
      TargetFolder: '$(Build.ArtifactStagingDirectory)/artifacts'

  - task: PublishBuildArtifacts@1
    displayName: Publish
